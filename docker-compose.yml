# AUTO-GENERATED by parascribe_cluster.py — do not edit by hand.
# 1 replica(s) = 1/GPU x 1 GPU(s) ['1'], behind an nginx gateway.
# gateway -> :8357 (clients)   replicas -> :18360..18360 (direct)
# Regenerate:  python3 parascribe_cluster.py gen
# Build the image first:  docker build -t parascribe-api:local ./parascribe
networks:
  parascribe-net:
    driver: bridge
services:
  parascribe-0:
    image: parascribe-api:local
    container_name: parascribe-0
    ports:
      - "18360:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ipc: host
    shm_size: '16gb'
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu, compute, utility]
    environment:
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=/workspace/.cache/huggingface
      # Alignment weights come from torchaudio, not the Hub, so they land in
      # the torch cache. Without this the 361 MB wav2vec2 checkpoint is
      # re-downloaded inside every new container — ~34s on a replica's first
      # job, against ~0.7s for the alignment itself.
      - TORCH_HOME=/root/.cache/torch
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
      - WHISPER_MODEL=large-v3
      - COMPUTE_TYPE=float16
      - DEFAULT_LANGUAGE=en
      - BATCH_SIZE=16
      - DATA_DIR=/data
      # V2 sentence/realtime transcription uses multilingual Parakeet v3
      # INT8 on CPU; WhisperX remains the unchanged V1 batch pipeline.
      - SESSION_ASR_MODEL=nemo-parakeet-tdt-0.6b-v3
      - SESSION_ASR_QUANTIZATION=int8
      - SESSION_ASR_THREADS=8
      - SESSION_ASR_MODE=${SESSION_ASR_MODE:-parakeet}
      - COHERE_MODEL_PATH=/models/cohere-transcribe-03-2026-Q8_0.gguf
      - COHERE_BACKEND=${COHERE_BACKEND:-cpu}
      # V2 speaker embeddings are compared only inside one session. Defaults
      # were calibrated on AMI meeting utterances; recalibrate per deployment.
      # New speakers are created only after two unmatched sentences agree.
      - VOICEPRINT_MODEL=pyannote/wespeaker-voxceleb-resnet34-LM
      - VOICEPRINT_SIMILARITY_THRESHOLD=0.30
      - VOICEPRINT_UPDATE_THRESHOLD=0.30
      - VOICEPRINT_CONFIRM_NEW_SPEAKERS=1
      - STREAM_MAX_UTTERANCE_SECONDS=60
      # One worker per replica: parallelism comes from multiple replica
      # processes, not threads. REPLICA_ID is stamped onto job_ids so the
      # gateway can route job lookups back here.
      - WORKERS=1
      - REPLICA_ID=0
    volumes:
      - ~/.cache/huggingface:/workspace/.cache/huggingface
      - ~/.cache/torch:/root/.cache/torch
      - ./parascribe/data:/data
      - ./models:/models:ro
    networks:
      - parascribe-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  parascribe-gateway:
    image: nginx:alpine
    container_name: parascribe-gateway
    ports:
      - "8357:8000"
    volumes:
      - ./parascribe-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      parascribe-0:
        condition: service_healthy
    networks:
      - parascribe-net
    restart: unless-stopped
    healthcheck:
      # busybox wget (nginx:alpine) needs split flags (not bundled -qO-) and
      # 127.0.0.1 (it resolves localhost to IPv6 ::1, which nginx doesn't bind).
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
