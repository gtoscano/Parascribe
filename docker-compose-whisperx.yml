# Run with:   docker compose -f docker-compose-whisperx.yml up -d --build
# Stop/pause:  docker compose -f docker-compose-whisperx.yml stop
# Resume:      docker compose -f docker-compose-whisperx.yml start
# API on GPU 1, port 8357. Can run alongside a model on GPU 0 (8355/8356).
#
# First run downloads Whisper large-v3 (~3 GB) + pyannote diarization models.
# Diarization requires a HF token (HUGGINGFACE_HUB_TOKEN in .env) AND accepting
# the licenses at huggingface.co/pyannote/speaker-diarization-3.1 and
# huggingface.co/pyannote/segmentation-3.0 once with that account.
services:
  whisperx:
    build:
      context: ./whisperx
    image: whisperx-api:local
    container_name: whisperx

    ports:
      - "8357:8000"

    dns:
      - 1.1.1.1
      - 8.8.8.8

    network_mode: "bridge"

    ipc: host
    shm_size: '16gb'

    ulimits:
      memlock: -1
      stack: 67108864

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu, compute, utility]

    environment:
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=/workspace/.cache/huggingface
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
      # --- WhisperX tuning ---
      - WHISPER_MODEL=large-v3       # large-v3 | large-v3-turbo | medium ...
      - COMPUTE_TYPE=float16         # int8 to save VRAM, float16 for quality
      - DEFAULT_LANGUAGE=en
      - BATCH_SIZE=16
      - DATA_DIR=/data
      # Worker THREADS per instance. Keep at 1: the pipeline is GIL/CPU-bound,
      # so extra threads serialize on the GIL and only add GPU contention
      # (measured: no throughput gain, higher latency). For real parallelism
      # run multiple replica processes instead — see whisperx_cluster.py.
      - WORKERS=1

    volumes:
      - ~/.cache/huggingface:/workspace/.cache/huggingface
      - ./whisperx/data:/data        # in/ uploads, out/<job_id>/ transcripts

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
