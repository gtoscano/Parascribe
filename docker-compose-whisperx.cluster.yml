# AUTO-GENERATED by whisperx_cluster.py — do not edit by hand.
# 2 replica(s) = 2/GPU x 1 GPU(s) ['1'], behind an nginx gateway.
# gateway -> :8357 (clients)   replicas -> :8360..8361 (direct)
# Regenerate:  python3 whisperx_cluster.py gen
# Build the image first:  docker build -t whisperx-api:local ./whisperx
networks:
  whisperx-net:
    driver: bridge
services:
  whisperx-0:
    image: whisperx-api:local
    container_name: whisperx-0
    ports:
      - "8360:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ipc: host
    shm_size: '16gb'
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu, compute, utility]
    environment:
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=/workspace/.cache/huggingface
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
      - WHISPER_MODEL=large-v3
      - COMPUTE_TYPE=float16
      - DEFAULT_LANGUAGE=en
      - BATCH_SIZE=16
      - DATA_DIR=/data
      # One worker per replica: parallelism comes from multiple replica
      # processes, not threads. REPLICA_ID is stamped onto job_ids so the
      # gateway can route job lookups back here.
      - WORKERS=1
      - REPLICA_ID=0
    volumes:
      - ~/.cache/huggingface:/workspace/.cache/huggingface
      - ./whisperx/data:/data
    networks:
      - whisperx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  whisperx-1:
    image: whisperx-api:local
    container_name: whisperx-1
    ports:
      - "8361:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ipc: host
    shm_size: '16gb'
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu, compute, utility]
    environment:
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_HOME=/workspace/.cache/huggingface
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=0
      - WHISPER_MODEL=large-v3
      - COMPUTE_TYPE=float16
      - DEFAULT_LANGUAGE=en
      - BATCH_SIZE=16
      - DATA_DIR=/data
      # One worker per replica: parallelism comes from multiple replica
      # processes, not threads. REPLICA_ID is stamped onto job_ids so the
      # gateway can route job lookups back here.
      - WORKERS=1
      - REPLICA_ID=1
    volumes:
      - ~/.cache/huggingface:/workspace/.cache/huggingface
      - ./whisperx/data:/data
    networks:
      - whisperx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  whisperx-gateway:
    image: nginx:alpine
    container_name: whisperx-gateway
    ports:
      - "8357:8000"
    volumes:
      - ./whisperx-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      whisperx-0:
        condition: service_healthy
      whisperx-1:
        condition: service_healthy
    networks:
      - whisperx-net
    restart: unless-stopped
    healthcheck:
      # busybox wget (nginx:alpine) needs split flags (not bundled -qO-) and
      # 127.0.0.1 (it resolves localhost to IPv6 ::1, which nginx doesn't bind).
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
